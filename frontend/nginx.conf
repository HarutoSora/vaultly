server {
    listen 443 ssl;
    server_name local.passwordvault.com localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: any route that isn't a real file falls back to index.html so
    # client-side routing (react-router) handles it.
    location / {
        try_files $uri /index.html;
    }

    # Same-origin from the browser's point of view — it only ever talks to
    # this nginx over HTTPS. The hop to the api container is plain HTTP,
    # but it never leaves the Docker network, so that's not a downgrade.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }
}

# Plain HTTP redirects to HTTPS — the session cookie is Secure-only anyway.
server {
    listen 80;
    server_name local.passwordvault.com localhost;
    return 301 https://$host$request_uri;
}
